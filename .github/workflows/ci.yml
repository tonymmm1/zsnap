name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: make static
      - run: file target/x86_64-unknown-linux-musl/release/zsnap | grep -E 'static-pie linked|statically linked'
      - name: Validate shell scripts
        run: >-
          sh -n
          install.sh
          ci/install-nfpm.sh
          ci/package-release.sh
          ci/package-native.sh
          ci/test-distro.sh
          contrib/zsnap.openrc
          contrib/zsnap.periodic
          packaging/postinstall.sh
          packaging/postremove.sh
          packaging/zsnap.openrc
          packaging/zsnap.periodic
      - name: Validate Bash benchmark harness
        run: |
          bash -n benchmarks/run-zfs-benchmark.sh benchmarks/zfs-benchmark.sh
          SANOID_STABLE_BIN=/bin/true \
          SANOID_DEVELOPMENT_BIN=/bin/true \
            benchmarks/run-zfs-benchmark.sh --help >/dev/null
          test -s benchmarks/results.md
          test -s benchmarks/results.html
          test -s benchmarks/results.tsv
      - name: Validate staged static installation
        run: >-
          make install-static-none
          DESTDIR="$RUNNER_TEMP/zsnap-root"
      - name: Validate release archive
        env:
          DIST_DIR: ${{ runner.temp }}/zsnap-dist
        run: |
          ./ci/package-release.sh x86_64-unknown-linux-musl 0.0.0-ci
          cd "$DIST_DIR"
          sha256sum --check --strict ./*.sha256
      - name: Validate native packages
        env:
          DIST_DIR: ${{ runner.temp }}/zsnap-packages
          NFPM_VERSION: 2.47.0
        run: |
          ./ci/install-nfpm.sh "$NFPM_VERSION" x86_64 "$RUNNER_TEMP/nfpm"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          NFPM="$RUNNER_TEMP/nfpm/nfpm" \
            ./ci/package-native.sh x86_64-unknown-linux-musl 0.0.0-ci amd64
          cd "$DIST_DIR"
          sha256sum --check --strict ./*.sha256
          dpkg-deb --field zsnap_0.0.0-ci_amd64.deb Architecture | grep -Fx amd64
          file zsnap-0.0.0-ci-1.x86_64.rpm | grep -F 'RPM'
          test -s zsnap-0.0.0-ci-x86_64.apk
          test -s zsnap-0.0.0-ci-1-x86_64.pkg.tar.zst

  distro-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 13
            image: debian:13
          - name: Fedora 44
            image: fedora:44
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - name: RHEL UBI 9
            image: registry.access.redhat.com/ubi9/ubi:latest
          - name: Rocky Linux 9
            image: rockylinux:9
          - name: Alpine 3.22
            image: alpine:3.22
          - name: Arch Linux
            image: archlinux:base
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test in distribution container
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/source:ro"
          "${{ matrix.image }}"
          sh /source/ci/test-distro.sh
