name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - name: Verify tag matches Cargo package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$RELEASE_TAG" != "v$crate_version" ]; then
            echo "tag $RELEASE_TAG does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked

  build-static:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            compiler: gcc
            package-arch: amd64
            nfpm-arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            compiler: gcc
            package-arch: arm64
            nfpm-arch: arm64
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Install native linker and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils file
      - name: Build static binary
        run: >-
          make static
          STATIC_TARGET="${{ matrix.target }}"
          MUSL_CC="${{ matrix.compiler }}"
      - name: Verify static linkage
        env:
          BINARY: target/${{ matrix.target }}/release/zsnap
        run: |
          file "$BINARY"
          if readelf -d "$BINARY" | grep -q NEEDED; then
            echo "$BINARY has dynamic library dependencies" >&2
            exit 1
          fi
      - name: Smoke test native artifact
        run: target/${{ matrix.target }}/release/zsnap --version
      - name: Package release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./ci/package-release.sh "${{ matrix.target }}" "${RELEASE_TAG#v}"
      - name: Install verified nFPM
        env:
          NFPM_ARCH: ${{ matrix.nfpm-arch }}
          NFPM_VERSION: 2.47.0
        run: |
          ./ci/install-nfpm.sh "$NFPM_VERSION" "$NFPM_ARCH" "$RUNNER_TEMP/nfpm"
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Build native Linux packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./ci/package-native.sh \
            "${{ matrix.target }}" \
            "${RELEASE_TAG#v}" \
            "${{ matrix.package-arch }}"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: release
        run: sha256sum --check --strict ./*.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "zsnap $GITHUB_REF_NAME"
