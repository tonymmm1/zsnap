[package]
name = "zsnap"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Fast, policy-driven ZFS snapshot management"
license = "MIT"
repository = "https://github.com/tonymmm1/zsnap"
homepage = "https://tonymmm1.github.io/zsnap/"
readme = "README.md"
keywords = ["zfs", "snapshot", "backup", "sanoid"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
