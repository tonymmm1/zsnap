# Fully worked documentation example; it is not installed as the host config.
# Dataset names below are illustrative and are never treated as defaults.
# zsnap configuration format. Dataset headers allow [pool] and [pool/dataset],
# template headers use [template_name], and use_templates accepts bare simple names.
# Other values use normal TOML syntax.
version = 1

[settings]
# Sanoid-compatible names: autosnap_YYYY-MM-DD_HH:MM:SS_<period>
snapshot_prefix = "autosnap"

# Use the host's local timezone for schedules and snapshot names by default.
# Set this to "utc" for UTC civil schedules and names.
timezone = "local"

# Recommended for a normal host with a handful of pools: leave this at 0, which
# means one worker for every pool represented by the plan. On a host with many
# pools or shared storage hardware, set 2-4 to place a global cap on pool workers.
# Work inside each pool remains serialized to avoid competing writes to one pool.
max_parallel_pools = 0

# Maximum targets grouped into one ZFS command; these do not create threads.
# Defaults are conservative. Valid ranges are 1-256 and 1-128 respectively.
snapshot_batch_size = 128
prune_batch_size = 64

lock_file = "/run/zsnap/zsnap.lock"
# Reporting-only status summary. Snapshot and prune decisions never read this file.
cache_file = "/etc/zsnap/zsnap.cache"
zfs_command = "zfs"
zpool_command = "zpool"

# Pruning is ownership-safe and is not configurable: only snapshots carrying
# org.zsnap:managed=yes are eligible. Compatible unmarked names may prevent a
# duplicate snapshot, but they are never deleted.

[notifications]
# Webhooks are delivered after the ZFS lock is released. Each endpoint has its
# own retry loop, and different endpoints are sent concurrently up to this cap.
# Four is intentionally modest; lowering it only makes sense for a rate-limited
# local relay, while raising it helps only when more than four hooks are configured.
enabled = true
max_parallel = 4

# These values apply to each endpoint. At the defaults, one unreachable endpoint
# can take roughly 32 seconds across three 10-second attempts and two backoffs.
timeout_seconds = 10
max_attempts = 3
retry_backoff_milliseconds = 500

# Normally a webhook outage is logged but does not make a successful snapshot
# run fail. Enable this only if monitoring delivery is part of job success.
fail_on_error = false

# Override the host label in messages. If omitted, HOSTNAME or /etc/hostname is used.
# hostname = "storage-01"

# URLs may be stored directly in this mode-0600 TOML file or read from an
# environment variable. The installed systemd service optionally reads
# /etc/zsnap/webhooks.env for url_env values. Failure-only is the default.
#
# [[notifications.webhooks]]
# name = "primary-flock"
# kind = "flock"
# url_env = "ZSNAP_FLOCK_WEBHOOK"
# events = ["failure"]
#
# [[notifications.webhooks]]
# name = "storage-discord"
# kind = "discord"
# url = "https://discord.com/api/webhooks/REPLACE/REPLACE"
# events = ["failure", "success"]
#
# [[notifications.webhooks]]
# name = "operations-slack"
# kind = "slack"
# url = "https://hooks.slack.com/services/REPLACE/REPLACE/REPLACE"
# events = ["failure"]

[template_production]
autosnap = true
autoprune = true
frequently = 0
hourly = 36
daily = 30
weekly = 4
monthly = 3
yearly = 0

# Preferred schedule in the selected timezone. weekly_wday is ISO:
# Monday=1, Sunday=7.
frequent_period = 15
hourly_min = 0
daily_hour = 23
daily_min = 59
weekly_wday = 1
weekly_hour = 23
weekly_min = 30
monthly_mday = 1
monthly_hour = 0
monthly_min = 0
yearly_mon = 1
yearly_mday = 1
yearly_hour = 0
yearly_min = 0

# 0 always allows pruning. A nonzero value defers pruning until the pool reaches
# this capacity percentage.
prune_defer = 0

[template_backup]
autosnap = false
autoprune = true
frequently = 0
hourly = 48
daily = 90
weekly = 4
monthly = 12
yearly = 0

# Dataset sections are intentionally commented out. Nothing is managed until an
# administrator replaces or confirms a name and uncomments the whole stanza.
# Manage every dataset below tank/data individually. Explicit child sections can
# override this inherited policy. A pool root is also supported as [tank].
# [tank/data]
# use_templates = [production]
# recursive = true

# This child starts with its inherited policy, reapplies production, then changes
# only hourly retention.
# [tank/data/vm]
# use_templates = [production]
# hourly = 12

# Hooks are argv arrays, never implicit shell strings. Policy fields live directly
# in the dataset section, just like the hourly override above.
# pre_snapshot_script = ["/usr/local/libexec/zsnap/quiesce", "--guest", "vm"]
# post_snapshot_script = ["/usr/local/libexec/zsnap/resume", "--guest", "vm"]
# pre_pruning_script = ["/usr/local/libexec/zsnap/before-prune"]
# pruning_script = ["/usr/local/libexec/zsnap/after-prune"]
# script_timeout = 10
# no_inconsistent_snapshot = true
# force_post_snapshot_script = true
