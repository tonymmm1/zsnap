# zsnap configuration format. All timestamps and schedules use UTC.
version = 1

[settings]
# Sanoid-compatible names: autosnap_YYYY-MM-DD_HH:MM:SS_<period>
snapshot_prefix = "autosnap"

# 0 means one worker for every pool represented by the plan. Work inside each
# pool is serialized and batched to avoid turning command concurrency into I/O contention.
max_parallel_pools = 0
snapshot_batch_size = 128
prune_batch_size = 64

lock_file = "/run/zsnap/zsnap.lock"
zfs_command = "zfs"
zpool_command = "zpool"

# Existing Sanoid-compatible snapshots count when deciding whether a snapshot
# is due, but are not deleted unless this migration switch is explicitly enabled.
prune_sanoid_snapshots = false

[notifications]
# Webhooks are delivered after the ZFS lock is released. Each endpoint has its
# own retry loop, and different endpoints are sent concurrently up to this cap.
enabled = true
max_parallel = 4
timeout_seconds = 10
max_attempts = 3
retry_backoff_milliseconds = 500

# HTTPS is required by default. Leave this false for Internet webhooks.
allow_insecure_http = false

# Normally a webhook outage is logged but does not make a successful snapshot
# run fail. Enable this only if monitoring delivery is part of job success.
fail_on_error = false

# Override the host label in messages. If omitted, HOSTNAME or /etc/hostname is used.
# hostname = "storage-01"

# URLs may be stored directly in this mode-0600 TOML file or read from an
# environment variable. The installed systemd service optionally reads
# /etc/zsnap/webhooks.env for url_env values. Failure-only is the default.
#
# [[notifications.webhooks]]
# name = "primary-flock"
# kind = "flock"
# url_env = "ZSNAP_FLOCK_WEBHOOK"
# events = ["failure"]
#
# [[notifications.webhooks]]
# name = "storage-discord"
# kind = "discord"
# url = "https://discord.com/api/webhooks/REPLACE/REPLACE"
# events = ["failure", "success"]
#
# [[notifications.webhooks]]
# name = "operations-slack"
# kind = "slack"
# url = "https://hooks.slack.com/services/REPLACE/REPLACE/REPLACE"
# events = ["failure"]

[templates.production]
autosnap = true
autoprune = true
frequently = 0
hourly = 36
daily = 30
weekly = 4
monthly = 3
yearly = 0

# Preferred UTC schedule. weekly_wday is ISO: Monday=1, Sunday=7.
frequent_period = 15
hourly_min = 0
daily_hour = 23
daily_min = 59
weekly_wday = 1
weekly_hour = 23
weekly_min = 30
monthly_mday = 1
monthly_hour = 0
monthly_min = 0
yearly_mon = 1
yearly_mday = 1
yearly_hour = 0
yearly_min = 0

# 0 always allows pruning. A nonzero value defers pruning until the pool reaches
# this capacity percentage.
prune_defer = 0

[templates.backup]
autosnap = false
autoprune = true
frequently = 0
hourly = 48
daily = 90
weekly = 4
monthly = 12
yearly = 0

# Manage every dataset below tank/data individually. Explicit child sections
# can override this inherited policy.
[datasets."tank/data"]
use_templates = ["production"]
recursive = true

# This child starts with its inherited policy, reapplies production, then changes
# only hourly retention.
[datasets."tank/data/vm"]
use_templates = ["production"]

[datasets."tank/data/vm".policy]
hourly = 12

# `recursive = "zfs"` uses `zfs snapshot -r` for atomic tree-wide snapshots.
# Child policy sections are intentionally rejected under an atomic root.
[datasets."archive/incoming"]
use_templates = ["backup"]
recursive = "zfs"

# Hooks are argv arrays, never implicit shell strings. Put them in a template or
# dataset policy. Hooked datasets are kept out of command batches.
# [datasets."tank/data/vm".policy]
# pre_snapshot_script = ["/usr/local/libexec/zsnap/quiesce", "--guest", "vm"]
# post_snapshot_script = ["/usr/local/libexec/zsnap/resume", "--guest", "vm"]
# pre_pruning_script = ["/usr/local/libexec/zsnap/before-prune"]
# pruning_script = ["/usr/local/libexec/zsnap/after-prune"]
# script_timeout = 10
# no_inconsistent_snapshot = true
# force_post_snapshot_script = true
